[workspace]
resolver = "2"
members = ["libro_personal"]

[workspace.dependencies]
# Versión fijada de forma exacta: no actualizar a mitad de proyecto sin revisar cambios de API.
soroban-sdk = "=29.0.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
